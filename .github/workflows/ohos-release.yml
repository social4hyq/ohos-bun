# OHOS (HarmonyOS) aarch64 Release CI
#
# Self-hosted runner on HarmonyOS PC. Manual-only: full rebuild, full test
# suite (1868 test files, single machine, no Buildkite sharding — much
# slower wall-clock than upstream's 20-way-sharded cluster), then publishes
# a GitHub Release + Homebrew bottle to atomgit, gated on >=99% pass rate.
#
# Split out from ohos-build.yml (2026-07-12) so a routine push to
# ohos-aarch64 can no longer cancel a multi-hour release run in flight, and
# so the fast push-triggered build stays fast. The build/sign steps below
# are intentionally a full copy of ohos-build.yml's, not a shared reusable
# workflow — this runs standalone and always tests exactly what it's about
# to release. Keep the two in sync by hand when touching build/env setup.
#
# Environment mirrors the successful Homebrew formula build (bun.rb).
# Key: brew cc/c++ wrappers auto-sign every ELF output (incl. cargo build-scripts).

name: OHOS Release

on:
  workflow_dispatch:
    inputs:
      bottle_rev:
        description: 'Bottle revision number (e.g. 30)'
        required: false
        type: string

concurrency:
  group: ohos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  OHOS_SDK_ROOT: /storage/Users/currentUser/.harmonybrew/opt/ohos-sdk
  OHOS_SYSROOT: /storage/Users/currentUser/.harmonybrew/opt/ohos-sdk/native/sysroot
  OHOS_LLVM_PREFIX: /storage/Users/currentUser/.harmonybrew/opt/llvm@21
  OHOS_ICU_PREFIX: /storage/Users/currentUser/.harmonybrew/opt/icu4c@78
  HOMEBREW_PREFIX: /storage/Users/currentUser/.harmonybrew
  TMPDIR: /data/storage/el2/base/tmp
  # CARGO_BUILD_JOBS used to be capped (1, then 4) because the shared
  # llvm@21 cc/c++ shims signed build outputs in-place with no sync before
  # returning control to the caller, and concurrent cargo build-script
  # link+exec hit ETXTBSY. The shared shim has since been fixed (llvm@21
  # formula's LLD --code-sign design, redeployed 2026-07-11, and further
  # fixed 2026-07-11 to only sign at actual link time rather than every
  # invocation) — verified locally (exec + dlopen) and via CI at jobs=4
  # with zero ETXTBSY. No cap here: let cargo use its own default
  # (nproc-based) parallelism. Re-add a cap if ETXTBSY or OOM resurfaces.
  RUSTUP_HOME: /data/storage/el2/base/tmp/rust-nightly-2026-05-06
  CARGO_HOME: /data/storage/el2/base/tmp/rust-nightly-2026-05-06/cargo
  RUSTUP_TOOLCHAIN: nightly-2026-05-06
  # brew cc/c++ wrappers auto-sign ELF outputs (OHOS kernel exec requirement)
  CC: /storage/Users/currentUser/.harmonybrew/bin/cc
  CXX: /storage/Users/currentUser/.harmonybrew/bin/c++

jobs:
  release:
    runs-on: self-hosted
    # Configure+Build alone can take ~40-90 min; Test bun budgets up to 240
    # min on top of that — give the whole job enough room so the job-level
    # limit doesn't cut off a run that's still within Test bun's own timeout.
    timeout-minutes: 420
    permissions:
      contents: write # gh release create

    steps:
      - uses: actions/checkout@v4

      - name: Link persistent build caches
        run: |
          # This self-hosted runner (github-act-runner, a third-party
          # implementation, not the official GitHub Actions runner) doesn't
          # implement actions/cache@v4's backend — there is no
          # ACTIONS_CACHE_URL in the job environment, so every
          # restore/save step silently no-ops (actions/cache's own
          # documented graceful-degradation behavior when it can't reach a
          # cache service). Verified via the runner binary (no cache-service
          # strings beyond its own unrelated action-repo cache) and via two
          # separate runs' vendor/WebKit reflogs, both showing a fresh
          # `git clone` despite an unchanged .webkit-version.
          #
          # Symlink these paths at a fixed location outside the per-job
          # ephemeral workdir instead. Existing scripts (Prepare WebKit
          # source's retry_git logic, cargo, ninja) all work incrementally
          # through the symlink with no other changes needed — this restores
          # actual persistence, not just a green checkmark.
          CACHE_ROOT=/storage/Users/currentUser/.cache/ohos-bun-ci
          mkdir -p "$CACHE_ROOT/webkit-src" "$CACHE_ROOT/webkit-build" "$CACHE_ROOT/rust-target"
          mkdir -p vendor build/release/deps
          rm -rf vendor/WebKit build/release/deps/WebKit build/release/rust-target
          ln -sfn "$CACHE_ROOT/webkit-src" vendor/WebKit
          ln -sfn "$CACHE_ROOT/webkit-build" build/release/deps/WebKit
          ln -sfn "$CACHE_ROOT/rust-target" build/release/rust-target

      - name: Sync WebKit version pin
        run: |
          grep 'export const WEBKIT_VERSION' scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}' > .webkit-version
          echo "Pinned WebKit commit: $(cat .webkit-version)"

      # --- Environment ---

      - name: Setup toolchain
        run: |
          mkdir -p .bin
          # Use brew cc/c++ wrappers that auto-sign every ELF output
          ln -sf "$HOMEBREW_PREFIX/bin/cc" .bin/clang
          ln -sf "$HOMEBREW_PREFIX/bin/c++" .bin/clang++
          ln -sf "$OHOS_LLVM_PREFIX/bin/llvm-strip" .bin/strip
          ln -sf "$HOMEBREW_PREFIX/bin/cc" .bin/gcc

      - name: Setup ICU symlinks
        run: |
          mkdir -p build/ohos-icu/target/include build/ohos-icu/target/lib || exit 1
          ln -sf "$OHOS_ICU_PREFIX/include/unicode" build/ohos-icu/target/include/unicode || exit 1
          for a in libicudata.a libicui18n.a libicuuc.a; do
            ln -sf "$OHOS_ICU_PREFIX/lib/$a" "build/ohos-icu/target/lib/$a" || exit 1
          done
          mkdir -p build/ohos-icu/host/bin || exit 1
          for t in genrb genccode gencmn pkgdata; do
            if [ -f "$OHOS_ICU_PREFIX/bin/$t" ]; then
              ln -sf "$OHOS_ICU_PREFIX/bin/$t" "build/ohos-icu/host/bin/$t" || true
            fi
          done

      - name: Setup LLVM cross-libs symlinks
        run: |
          mkdir -p build/ohos-cross-libs/libcxx/include
          ln -sf "$OHOS_LLVM_PREFIX/include/aarch64-linux-ohos/c++/v1" build/ohos-cross-libs/libcxx/include/v1
          mkdir -p build/ohos-cross-libs/libcxxabi/include
          ln -sf "$OHOS_LLVM_PREFIX/include/aarch64-linux-ohos/c++/v1" build/ohos-cross-libs/libcxxabi/include
          for d in libcxx libcxxabi libunwind; do
            mkdir -p "build/ohos-cross-libs/$d/lib"
            for a in "$OHOS_LLVM_PREFIX/lib/aarch64-linux-ohos/"*.a; do
              ln -sf "$a" "build/ohos-cross-libs/$d/lib/$(basename "$a")"
            done
          done

      # --- Dependencies ---

      - name: bun install
        env:
          # Match Configure/Build PATH: the runner's default PATH no longer
          # includes ~/.harmonybrew/bin, so bun-bootstrap isn't found here
          # unless set explicitly (even though it's installed).
          PATH: ${{ github.workspace }}/.bin:/storage/Users/currentUser/.harmonybrew/opt/llvm@21/bin:/data/storage/el2/base/tmp/rust-nightly-2026-05-06/bin:/storage/Users/currentUser/.harmonybrew/bin:/storage/Users/currentUser/.harmonybrew/opt/bun-bootstrap/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          bun install
          bun install --cwd src/node-fallbacks

      # --- Build ---

      - name: Prepare WebKit source
        run: |
          retry_git() {
            n=$1; shift
            attempt=1
            while [ "$attempt" -le "$n" ]; do
              echo "git $* (attempt $attempt/$n)"
              if git "$@" 2>&1; then
                return 0
              fi
              echo "Failed, retrying in 10s..."
              sleep 10
              attempt=$((attempt + 1))
            done
            return 1
          }

          WEBKIT_VERSION=$(cat .webkit-version)
          echo "WEBKIT_VERSION=$WEBKIT_VERSION" >> "$GITHUB_ENV"

          if [ -d vendor/WebKit/.git ] && git -C vendor/WebKit cat-file -e "$WEBKIT_VERSION" 2>/dev/null; then
            echo "WebKit source cache hit — checkout $WEBKIT_VERSION"
            git -C vendor/WebKit checkout -f "$WEBKIT_VERSION"
          elif [ -d vendor/WebKit/.git ]; then
            echo "WebKit repo present but missing $WEBKIT_VERSION — trying incremental fetch..."
            if retry_git 3 -C vendor/WebKit fetch --depth=500 origin "$WEBKIT_VERSION" \
               && git -C vendor/WebKit cat-file -e "$WEBKIT_VERSION" 2>/dev/null; then
              git -C vendor/WebKit checkout -f "$WEBKIT_VERSION"
            elif retry_git 3 -C vendor/WebKit fetch --deepen=2000 origin main \
               && git -C vendor/WebKit cat-file -e "$WEBKIT_VERSION" 2>/dev/null; then
              git -C vendor/WebKit checkout -f "$WEBKIT_VERSION"
            else
              echo "Incremental fetch exhausted, falling back to full re-clone..."
              rm -rf vendor/WebKit
            fi
          fi

          if [ ! -d vendor/WebKit/.git ]; then
            echo "No usable WebKit source cache, cloning fresh..."
            retry_git 3 clone --depth 1 https://github.com/oven-sh/WebKit.git vendor/WebKit \
              || { echo "ERROR: WebKit clone failed after retries"; exit 1; }
            retry_git 3 -C vendor/WebKit fetch --deepen=500 origin main || true
            if ! git -C vendor/WebKit checkout "$WEBKIT_VERSION" 2>/dev/null; then
              echo "Commit not in --deepen=500, trying --unshallow..."
              retry_git 3 -C vendor/WebKit fetch --unshallow origin || true
              git -C vendor/WebKit checkout "$WEBKIT_VERSION"
            fi
          fi

      - name: Configure
        env:
          # llvm@21 FIRST so ld.lld 21.1.8 shadows brew's 15.0.4
          PATH: ${{ github.workspace }}/.bin:/storage/Users/currentUser/.harmonybrew/opt/llvm@21/bin:/data/storage/el2/base/tmp/rust-nightly-2026-05-06/bin:/storage/Users/currentUser/.harmonybrew/bin:/storage/Users/currentUser/.harmonybrew/opt/bun-bootstrap/bin:/usr/local/bin:/usr/bin:/bin
          # LD_LIBRARY_PATH for lld runtime deps + cargo OpenSSL
          LD_LIBRARY_PATH: /storage/Users/currentUser/.harmonybrew/opt/openssl@3/lib:/storage/Users/currentUser/.harmonybrew/opt/libxml2/lib:/storage/Users/currentUser/.harmonybrew/opt/zlib/lib
        run: |
          echo "CC=$CC ($($CC --version | head -1))"
          echo "CXX=$CXX ($($CXX --version | head -1))"
          echo "ld.lld=$(which ld.lld) ($(ld.lld --version | head -1))"
          bun scripts/build.ts \
            --os=ohos \
            --arch=aarch64 \
            --profile=release \
            --webkit=local \
            --ohos-sdk-root="$OHOS_SDK_ROOT" \
            --ohos-sysroot="$OHOS_SYSROOT" \
            --configure-only

      - name: Build
        env:
          PATH: ${{ github.workspace }}/.bin:/storage/Users/currentUser/.harmonybrew/opt/llvm@21/bin:/data/storage/el2/base/tmp/rust-nightly-2026-05-06/bin:/storage/Users/currentUser/.harmonybrew/bin:/usr/local/bin:/usr/bin:/bin
          LD_LIBRARY_PATH: /storage/Users/currentUser/.harmonybrew/opt/openssl@3/lib:/storage/Users/currentUser/.harmonybrew/opt/libxml2/lib:/storage/Users/currentUser/.harmonybrew/opt/zlib/lib
          # OHOS: serialize Rust build-script runs so freshly-compiled proc-macro
          # binaries aren't exec'd while still being written → Text file busy (ETXTBSY).
          CARGO_BUILD_JOBS: 4
        run: ninja -C build/release bun

      # --- Sign final binary ---

      - name: Sign binary
        run: |
          cp build/release/bun build/release/bun.unsigned
          binary-sign-tool sign -selfSign 1 \
            -inFile build/release/bun.unsigned \
            -outFile build/release/bun
          chmod +x build/release/bun

      # --- Verify ---

      - name: Binary info
        run: |
          file build/release/bun
          ls -lh build/release/bun
          file build/release/bun | grep -qiE "ELF.*(arm64|aarch64)" || {
            echo "ERROR: Not an ARM64 ELF"; exit 1
          }

      - name: Smoke test
        env:
          NO_COLOR: "1"
        run: |
          RESULT=$(build/release/bun -e 'console.log(2**32)')
          echo "2**32 = $RESULT"
          [ "$RESULT" = "4294967296" ] || { echo "FAILED"; exit 1; }
          echo "Smoke test passed"

      # --- Full test suite (gates the release steps below) ---
      # Runs after the fast Smoke test so trivial breakage fails before
      # committing to this: 1868 test files, single machine, no Buildkite
      # sharding. --parallel uses all available cores (still much slower
      # wall-clock than upstream's 20-way-sharded cluster).

      - name: Test bun
        env:
          NO_COLOR: "1"
        timeout-minutes: 240
        run: |
          node scripts/runner.node.mjs \
            --exec-path=build/release/bun \
            --parallel \
            --results-json=test-results.json \
            --exclude=integration/bun-types \
          || true

      - name: Compute test pass rate
        id: test_summary
        run: |
          python3 -c "
          import json, os
          try:
              with open('test-results.json') as f:
                  results = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError) as e:
              print(f'test-results.json missing or unreadable ({e}) — treating as 0% pass rate')
              results = []
          total = len(results)
          passed = sum(1 for r in results if r.get('ok'))
          rate = (passed / total * 100) if total else 0
          print(f'Passed {passed}/{total} ({rate:.2f}%)')
          ok = 'true' if rate >= 99 else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pass_rate={rate:.2f}\n')
              out.write(f'pass_rate_ok={ok}\n')
              out.write(f'test_total={total}\n')
              out.write(f'test_passed={passed}\n')
          "

      # --- Artifact ---

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-ohos-aarch64
          path: build/release/bun
          retention-days: 30

      # --- Release (gated on >=99% test pass rate) ---

      - name: Create GitHub Release
        if: steps.test_summary.outputs.pass_rate_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUN_VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          TAG="ohos-aarch64-v${BUN_VERSION}-r${{ github.run_number }}"
          gh release create "$TAG" build/release/bun \
            --repo social4hyq/ohos-bun \
            --title "$TAG" \
            --notes "Automated release — test-bun pass rate ${{ steps.test_summary.outputs.pass_rate }}% (${{ steps.test_summary.outputs.test_passed }}/${{ steps.test_summary.outputs.test_total }})"

      - name: Create and upload bottle
        if: steps.test_summary.outputs.pass_rate_ok == 'true'
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          export BOTTLE_REV="${{ inputs.bottle_rev }}"
          bash scripts/ohos/upload-bottle.sh

      # Runs last so artifact upload / release / bottle above (each already
      # gated on pass_rate_ok individually) still happen when the rate is
      # fine. This step's only job is to turn the overall workflow red when
      # it isn't, so a regression doesn't silently show as a green run with
      # no release.
      - name: Enforce test pass-rate gate
        run: |
          if [ "${{ steps.test_summary.outputs.pass_rate_ok }}" != "true" ]; then
            echo "::error::Test pass rate ${{ steps.test_summary.outputs.pass_rate }}% is below the 99% gate (${{ steps.test_summary.outputs.test_passed }}/${{ steps.test_summary.outputs.test_total }} passed) — release and bottle steps were skipped."
            exit 1
          fi
