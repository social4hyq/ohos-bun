name: ohos-full-test

run-name: "ohos-full-test (filter=${{ inputs.test-filter || 'none' }})"

# Runs Bun's own `test/` suite (the real oven-sh/bun compat suite, vendored
# in this repo with OHOS patches on top) against the bun ACTUALLY SHIPPED by
# harmonybrew-core (social4hyq/core/bun bottle) — not a freshly rebuilt
# binary, not this branch's HEAD.
#
# Design borrows two things from upstream, adapted to what we actually have:
#
#   1. Container lifecycle (start/fixup/teardown) copies
#      harmonybrew-core/.github/workflows/bottle-build.yml's
#      .github/scripts/setup-container.sh almost verbatim: GitHub-hosted
#      ubuntu-24.04-arm runner + the same OHOS container image, spun up fresh
#      per run. Keep IMAGE in sync with that file if it bumps.
#
#   2. Test invocation copies oven-sh/bun's own Buildkite pipeline
#      (.buildkite/ci.mjs, getTestBunStep()) as closely as our infrastructure
#      allows: same script (scripts/runner.node.mjs), same flags
#      (--exec-path/--results-json/--exclude=integration/bun-types
#      --exclude=internal/source-lints). Buildkite runs this under a stable
#      system `node` so a broken candidate bun can't take down the harness
#      that's supposed to report on it; we do the same — Harmonybrew's own
#      default core tap ships an arm64_ohos `node` bottle (confirmed:
#      process.platform reports "openharmony", so all the OHOS branches in
#      runner.node.mjs/utils.mjs activate correctly under it) — no need for
#      the bun-bootstrap workaround this design went through in review.
#
#      Deliberately NOT passed: --parallel. Buildkite's own CI doesn't use
#      it either — getTestBunStep()'s command line never includes it.
#      Buildkite's "parallel" is machine-level sharding (parallelism: 20,
#      via --shard/--max-shards reading BUILDKITE_PARALLEL_JOB(_COUNT)),
#      with each shard running serially inside its own agent. We run as one
#      job with no sharding, so the faithful equivalent is just: run
#      serially, single job. (A matrix-of-shards version exists as a
#      follow-up if wall-clock time here becomes a problem — ask before
#      adding it, it multiplies container-setup cost by shard count.)
#
#      Also not reinvented: retry/flake handling. runner.node.mjs already
#      retries a failing file up to --retries times (maxAttempts = 1 +
#      retries) before counting it as failed; a file that passes on retry is
#      tracked as "flaky", not "failed", and is excluded from the
#      exit-code-determining result set (see the
#      `[...okResults, ...failedResults]` return in runTests(), flaky
#      omitted on purpose). test/expectations.txt's `[ OPENHARMONY ]`
#      entries are excluded from the run entirely before any test executes
#      (getRelevantTests()). So the plain process exit code already means
#      "failed after retries, and not a known/accepted OHOS limitation" —
#      no separate rerun-and-diff pass needed on top of that.
#
#      We pass --retries=1 rather than taking the CI default of 3: the
#      slowest remaining failures are minutes long on their own
#      (cli/run/run-crash-handler.test.ts measured 411s in run 30150421934),
#      so 4 attempts each would cost more wall clock than the entire rest of
#      the suite. One retry still separates a hard failure from a flake,
#      which is all the exit code needs.
#
# What's NOT borrowed from Buildkite: the platform matrix (testPlatforms in
# ci.mjs). We only have one target — arm64_ohos — so there's exactly one
# lane, not twelve.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional --include substring filter (e.g. "js/node/test/parallel"), for a quick partial run instead of the full ~5200-file suite'
        required: false
        type: string
        default: ''
  schedule:
    # Weekly, Sunday 21:00 UTC. This runs serially (see the no-`--parallel`
    # note above), single job, no sharding. Measured shape of the suite on
    # this runner (run 30150421934, after subtracting the css-fuzz stall the
    # CI= fix below removes): ~5min container/dependency setup, ~46min for
    # the first ~300 files (bake/ bundler/ cli/ integration/ — of which
    # bake/dev, now excluded, was ~27min), and under a minute for the
    # remaining ~4900, since the 3251-file parallel-safe phase already runs
    # 4-wide. So the cost is concentrated in a few dozen slow files, and a
    # sharded matrix would have to beat a ~5min per-shard setup tax to be
    # worth it. Revisit that only if a real baseline stops fitting inside
    # timeout-minutes below.
    - cron: '0 21 * * 0'

permissions:
  contents: read

concurrency:
  group: ohos-full-test-${{ github.event_name }}
  cancel-in-progress: false

env:
  # Keep in sync with harmonybrew-core/.github/workflows/bottle-build.yml's
  # IMAGE — same OHOS container, just consumed from a different repo's CI.
  IMAGE: swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner@sha256:57ce4ca832d937dcc86abae6ec0e8fb6b34ac86aa8fdbe43548b6fe78d3438c1 # :latest, 2026-07-03 (SWR mirror, anon-pullable)
  CONTAINER: ohos-fulltest
  BREW_ENV: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Start OHOS container
        run: |
          docker pull "$IMAGE"
          # seccomp=unconfined: default docker profile blocks io_uring_setup, killing bun
          docker run -d --name "$CONTAINER" --init \
            --security-opt seccomp=unconfined \
            "$IMAGE" sleep infinity

          # musl tmpfile() hardcoded path + /system/bin/sh + /system/lib/ld-musl
          # (bottle ELFs' PT_INTERP targets the real-device path) — same
          # one-time fixup as bottle-build.yml's setup-container.sh.
          docker exec "$CONTAINER" bash -lc '
            mkdir -p /data/local/tmp /system/bin /system/lib &&
            ln -sf /bin/sh /system/bin/sh &&
            ln -sf /lib/ld-musl-aarch64.so.1 /system/lib/ld-musl-aarch64.so.1
          '

          # There is no docker/podman inside this container, and there never
          # will be — but test/harness.ts:1051 turns that into a hard error
          # rather than a skip once CI is set (see the Run test suite step):
          #
          #   dockerExe() -> which("docker") || which("podman") -> null
          #   -> if (isCI && isLinux) throw "A functional `docker` is required"
          #
          # and harness.ts:21 counts openharmony as isLinux. That throw is at
          # module scope in ~20 files (js/sql/*, js/bun/s3, cli/install/
          # bun-install-proxy, js/bun/test/parallel/test-docker-build-*,
          # regression/issue/26063 + 28632, …), so they would go from
          # "loads, skips its docker describes, passes" to "fails to load".
          #
          # The very next branch in isDockerEnabled() is
          # `if (isLinux && process.arch === "arm64") return false` — upstream
          # already disables docker tests on this architecture. It is simply
          # ordered after the presence check. A stub on PATH satisfies the
          # presence check and lets that arm64 rule answer, which is the
          # behaviour we get today with CI unset. It stays correct even if the
          # `docker info` probe is reached: /bin/true prints nothing, so the
          # "Server Version:" match fails and isDockerEnabled() returns false.
          #
          # Remove this once harness.ts orders the arm64 return before the
          # throw AND a bun bottle is cut from a revision containing that fix
          # — the test tree is checked out at the bottle's pinned revision
          # (see the checkout step), not at this workflow's ref, so fixing
          # harness.ts alone does not change what this job runs.
          docker exec "$CONTAINER" bash -lc '
            mkdir -p /usr/local/bin && ln -sf /bin/true /usr/local/bin/docker
          '

      - name: Install node (Harmonybrew default core tap) + bun bottle (social4hyq/core)
        run: |
          # The container image is a snapshot baked on a fixed date (see
          # IMAGE above) — its default-tap formula index can reference a
          # node version whose bottle has since been superseded/removed from
          # the CDN (hit exactly this: baked index said 26.4.0, live tap is
          # 26.5.0, the 26.4.0 bottle 404s). $BREW_ENV sets
          # HOMEBREW_NO_AUTO_UPDATE=1 (intentional for the social4hyq/core
          # tap below — we want exactly what we just tapped, not whatever
          # else `brew update` might touch), so it never self-heals unless
          # asked. `brew update` here, without that flag, refreshes the
          # default tap's index before we resolve node's bottle URL from it.
          docker exec "$CONTAINER" bash -lc "brew update"
          docker exec "$CONTAINER" bash -lc "$BREW_ENV brew install node"
          docker exec "$CONTAINER" bash -lc "
            $BREW_ENV brew tap social4hyq/core https://atomgit.com/social4hyq/homebrew-core.git &&
            $BREW_ENV brew trust social4hyq/core &&
            $BREW_ENV brew install social4hyq/core/bun
          "

      - name: Smoke check
        run: |
          docker exec "$CONTAINER" bash -lc '
            node --version &&
            node -e "console.log(process.platform)" &&
            $(brew --prefix bun)/bin/bun --version &&
            $(brew --prefix bun)/bin/bun -e "console.log(2**32)"
          '

      - name: Resolve the bottled bun's exact source revision
        id: pin
        run: |
          REV=$(docker exec "$CONTAINER" bash -lc "$BREW_ENV brew cat social4hyq/core/bun" \
            | sed -n 's/.*revision: *"\([0-9a-f]*\)".*/\1/p' | head -1)
          if [ -z "$REV" ]; then
            echo "::error::could not extract a git revision from the bun formula's url line"
            exit 1
          fi
          echo "Bottled bun was built from social4hyq/ohos-bun@$REV"
          echo "sha=$REV" >> "$GITHUB_OUTPUT"

      - name: Failure diagnostics
        if: failure()
        run: |
          docker exec "$CONTAINER" bash -lc \
            'for f in /root/.cache/Homebrew/Logs/*/*; do echo "--- $f"; tail -30 "$f"; done' || true

      # Check out test/ + scripts/ (and everything else) at the EXACT commit
      # the bottle was built from — not this workflow's own triggering ref.
      # A drifted formula pin vs. checked-out source would silently test the
      # wrong test/expectations.txt against the running binary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: social4hyq/ohos-bun
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 1

      - name: Copy test tree into the container
        run: docker cp . "$CONTAINER":/root/bun-src

      # scripts/bootstrap.sh (this repo's own canonical CI bootstrap,
      # ~line 2210) runs `bun install --ignore-scripts` in BOTH the repo
      # root and test/ before any test runs, on every platform — not an
      # OHOS-specific step. Skipping either one breaks real test files:
      #
      #  - test/ alone: found by running this workflow for real.
      #    stringWidth.test.ts / stripANSI.test.ts import string-width /
      #    strip-ansi, declared only in test/package.json (root's
      #    package.json is Bun's own build deps, unrelated).
      #  - root before test/: also found by running it for real. test/'s
      #    own lockfile pins react as `file:../node_modules/react` — a
      #    relative reference to the ROOT node_modules, so `cd test && bun
      #    install` alone 404s on it ("failed to link package:
      #    react@../node_modules/react") unless root has already been
      #    installed first.
      #  - --ignore-scripts on both: also found by running it for real.
      #    Without it, test/'s puppeteer postinstall tries to download a
      #    Chromium build and throws "The current platform is not
      #    supported" for openharmony, aborting the whole install.
      - name: Install npm dependencies (root, then test/)
        run: |
          docker exec "$CONTAINER" bash -lc '
            cd /root/bun-src &&
            "$(brew --prefix bun)/bin/bun" install --ignore-scripts &&
            cd test &&
            "$(brew --prefix bun)/bin/bun" install --ignore-scripts
          '

      # No --parallel (see header note); --retries=1 instead of the CI
      # default of 3 (see header note). --quiet keeps the log from ballooning
      # over a run this long; --results-json is the artifact for any
      # follow-up triage, not for gating (the exit code IS the gate).
      #
      # --exclude=bake/dev: found by running the first full run for real (43
      # real failures, 9 of them here). Root cause has nothing to do with
      # OHOS: bake.DevServer's `--app` / dev-server feature set is gated by
      # `IS_CANARY || IS_DEBUG || BUN_FEATURE_FLAG_EXPERIMENTAL_BAKE`
      # (src/bun_core/feature_flags.rs) — harmonybrew-core's bun.rb builds a
      # genuine stable release (version "1.4.0", no canary flag), so `bake()`
      # is compiled off. Buildkite never surfaces this because its own
      # isCanary defaults true for every non-[release]-tagged build
      # (.buildkite/ci.mjs, getPipelineOptions()) — this repo's own CI is
      # effectively always testing canary, so this gap was never exercised
      # anywhere before this workflow tested an actual stable bottle. Would
      # fail identically on a stable macOS/Linux/Windows build; not an
      # OHOS-specific expectations.txt entry.
      #
      # The three cc.test/20144/26249 excludes: bun:ffi's cc() (the in-memory
      # TCC compiler) segfaults at address 0x48 *inside this container image*,
      # and the process then hangs instead of exiting, burning the whole test
      # timeout. Scoped precisely — exactly the 4 test files in the tree that
      # call cc() were the ones failing, and no others. Verified on a real
      # HarmonyOS device against the very same published bottle (adb57a212)
      # that CI pours: cc.test.ts 17 pass/0 fail, 20144 1 pass, 26249 2 pass.
      # So this is a container-environment artifact, not a defect in what
      # ships — and per this workspace's standing rule, real-device results,
      # not container results, decide shippability. Ruled out by direct
      # experiment (not assumed): OHOS_SYSROOT presence (segfaults either
      # way in-container) and /usr/lib64/libc.so -> ld-musl, which the
      # container has and the device lacks (feeding the device's TCC that
      # exact ld-musl as libc compiles fine). The faulting line itself is
      # still unidentified; excluding costs us cc() coverage in CI, which is
      # accepted because the device is the target and does pass.
      #
      # Deliberately NOT excluded, though it also calls cc() and also fails:
      # napi/napi-value-ffi.test.ts. It fails on the real device too, with a
      # different and genuine error ("include file 'bits/alltypes.h' not
      # found" resolving the OHOS SDK sysroot's stdint.h) — a real
      # device-affecting gap that belongs in test/expectations.txt, not here.
      #
      # CI/GITHUB_ACTIONS are passed explicitly because `docker exec` inherits
      # nothing from the runner's environment, and both the harness and the
      # runner branch on them:
      #
      #  - test/harness.ts's `isCI` (`process.env.CI !== undefined`) gates
      #    whole test bodies. Without it, js/bun/css/css-fuzz.test.ts runs its
      #    `if (!isCI)` fuzz loops — 2600 iterations over deliberately
      #    degenerate inputs (300-deep @media nesting, 100k-long selectors,
      #    10k-property rules). Upstream's own x64 lane records this file at
      #    57ms in test/expected-durations.json because CI skips all of it; in
      #    run 30150421934 it took 3h28m, 81.5% of a 4h15m suite. Same flag
      #    also drives harness's isFlaky/isBroken.
      #  - scripts/utils.mjs's `isCI`/`isGithubAction` drive the runner's own
      #    ::group:: folding and its --retries default.
      #
      # Whether the runner should treat itself as running under Actions is a
      # separate question from whether the *tests* do, but both answers are
      # yes here: the log is read in the Actions UI, and the tests are meant
      # to behave exactly as they do on upstream's lanes.
      - name: Run test suite
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set +e
          docker exec -e TEST_FILTER -e CI=true -e GITHUB_ACTIONS=true "$CONTAINER" bash -lc '
            cd /root/bun-src
            INCLUDE_ARGS=()
            if [ -n "$TEST_FILTER" ]; then
              INCLUDE_ARGS=(--include="$TEST_FILTER")
            fi
            node scripts/runner.node.mjs \
              --exec-path="$(brew --prefix bun)/bin/bun" \
              --quiet \
              --retries=1 \
              --results-json=/root/results.json \
              --exclude=integration/bun-types \
              --exclude=internal/source-lints \
              --exclude=bake/dev \
              --exclude=js/bun/ffi/cc.test.ts \
              --exclude=regression/issue/20144 \
              --exclude=regression/issue/26249 \
              "${INCLUDE_ARGS[@]}"
          '
          RUNNER_EXIT=$?
          set -e
          docker cp "$CONTAINER":/root/results.json results.json || true
          echo "runner exit code: $RUNNER_EXIT"
          exit $RUNNER_EXIT

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohos-full-test-results-${{ github.run_number }}
          path: results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop OHOS container
        if: always()
        run: docker rm -f "$CONTAINER" || true
