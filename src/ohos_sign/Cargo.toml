[workspace]
# Standalone workspace so `cargo test` works without the full bun workspace.
# The crate is also listed as a member in the root Cargo.toml for integration builds.
members = ["."]

[package]
name = "ohos_sign"
version = "0.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ohos-selfsign"
path = "src/bin/ohos_selfsign.rs"
